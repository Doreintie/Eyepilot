<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>手部 21 点验证 · EyePilot</title>
<link rel="stylesheet" href="./hand-probe.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>手部 21 点验证</h1>
    <span class="sub">回答一个问题：摄像头拍不拍得到写字的手</span>
  </header>

  <div class="grid">
    <div class="stage">
      <video id="cam" playsinline muted autoplay></video>
      <canvas id="overlay"></canvas>
      <div class="badge" id="badge">未启动</div>
    </div>

    <div>
      <div class="panel">
        <h2>实时状态</h2>
        <div class="big" id="energy">--<small>位移能量</small></div>
        <div class="bar"><i id="bar"></i></div>
        <div class="kv"><span>手在画面</span><b id="handCount">--</b></div>
        <div class="kv"><span>腕部区域</span><b id="region">--</b></div>
        <div class="kv"><span>近 60 秒出现率</span><b id="presence">--</b></div>
        <div class="kv"><span>推理耗时</span><b id="infer">--</b></div>
        <div class="kv"><span>帧率</span><b id="fps">--</b></div>
      </div>

      <div class="panel">
        <h2>能量曲线（近 15 秒）</h2>
        <canvas id="curve" width="520" height="92"></canvas>
        <div class="row" style="margin-top:10px">
          <button class="btn primary" id="btnStart">启动摄像头</button>
          <button class="btn" id="btnBase" disabled>记 3 秒静息基线</button>
        </div>
        <div class="verdict idle" id="verdict">等摄像头启动</div>
      </div>
    </div>
  </div>

  <p class="hint">
    用法：点「启动摄像头」→ 把手放到你平时写字的位置，正常写 20 秒 → 停笔不动 10 秒 → 看能量曲线有没有明显分层。
    分层清楚，说明「停笔 15 秒」这个判据在你这里成立；如果曲线一直贴地（手压根没进画面），那就得先调摄像头角度，否则场景 A 的所有设计都是空的。
  </p>
</div>

<script type="module">
import { FilesetResolver, HandLandmarker } from '../vendor/mediapipe/vision_bundle.mjs';

const $ = (id) => document.getElementById(id);
const video = $('cam');
const cv = $('overlay');
const ctx = cv.getContext('2d');
const curve = $('curve');
const cctx = curve.getContext('2d');

/* 21 点骨架连接 */
const BONES = [
  [0,1],[1,2],[2,3],[3,4],
  [0,5],[5,6],[6,7],[7,8],
  [5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],
  [13,17],[17,18],[18,19],[19,20],[0,17],
];
const TIPS = [0, 4, 8, 12, 16, 20];

let hand = null;
let running = false;
let prev = null;          // 上一帧归一化点
let energy = 0;
const hist = [];          // { t, e }
const presence = [];      // 1/0，最近 60 秒
let baseline = null;
let baseBuf = null;

const scaleOf = (pts) => {
  // 用手腕到中指根的距离当尺度，随远近自动缩放
  const d = Math.hypot(pts[9].x - pts[0].x, pts[9].y - pts[0].y);
  return Math.max(0.02, d);
};

const frameEnergy = (pts, prevPts) => {
  if (!prevPts) return 0;
  const s = scaleOf(pts);
  let sum = 0;
  for (const i of TIPS) sum += Math.hypot(pts[i].x - prevPts[i].x, pts[i].y - prevPts[i].y);
  return sum / TIPS.length / s;
};

async function start() {
  const btn = $('btnStart');
  btn.disabled = true;
  btn.textContent = '加载模型…';
  try {
    const fs = await FilesetResolver.forVisionTasks('../vendor/mediapipe/wasm');
    hand = await HandLandmarker.createFromOptions(fs, {
      baseOptions: { modelAssetPath: '../vendor/mediapipe/hand_landmarker.task', delegate: 'GPU' },
      runningMode: 'VIDEO',
      numHands: 2,
      minHandDetectionConfidence: 0.4,
      minTrackingConfidence: 0.4,
    });

    btn.textContent = '请求摄像头…';
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: 640, height: 480, facingMode: 'user' },
    });
    video.srcObject = stream;
    await video.play();
    $('badge').textContent = '运行中';
    $('badge').className = 'badge on';
    btn.textContent = '运行中';
    $('btnBase').disabled = false;
    running = true;
    loop();
  } catch (e) {
    console.error(e);
    $('badge').textContent = '启动失败';
    $('badge').className = 'badge off';
    $('verdict').className = 'verdict bad';
    $('verdict').textContent = '启动失败：' + (e?.name || '') + ' ' + (e?.message || e);
    btn.disabled = false;
    btn.textContent = '重试';
  }
}

let lastT = 0, fpsAcc = 0, fpsN = 0, inferMs = 0;

function loop() {
  if (!running) return;
  if (video.readyState >= 2 && hand) {
    const t0 = performance.now();
    const res = hand.detectForVideo(video, t0);
    inferMs = performance.now() - t0;

    cv.width = video.videoWidth || 640;
    cv.height = video.videoHeight || 480;
    ctx.clearRect(0, 0, cv.width, cv.height);

    const lm = res.landmarks && res.landmarks[0];
    const now = performance.now();

    if (lm) {
      drawSkeleton(lm);
      const e = frameEnergy(lm, prev);
      energy = energy * 0.6 + e * 0.4;   // 轻平滑，别把曲线抹平
      prev = lm;
      presence.push(1);
      $('handCount').textContent = res.landmarks.length + ' 只';
      $('badge').className = 'badge on';
      $('badge').textContent = '检测到手';
      const wy = lm[0].y;
      const wx = lm[0].x;
      $('region').textContent =
        (wy > 0.55 ? '画面下部（桌面区）' : '画面上部') + ' · x' + wx.toFixed(2);
    } else {
      energy *= 0.6;
      prev = null;
      presence.push(0);
      $('handCount').textContent = '0';
      $('badge').className = 'badge off';
      $('badge').textContent = '没有手';
      $('region').textContent = '--';
    }

    while (presence.length > 1800) presence.shift();   // 约 60s @30fps
    hist.push({ t: now, e: energy });
    while (hist.length && now - hist[0].t > 15000) hist.shift();

    /* 数字与状态 */
    $('energy').innerHTML = energy.toFixed(4) + '<small>位移能量</small>';
    const shown = Math.min(1, energy / 0.02);
    $('bar').style.width = (shown * 100).toFixed(1) + '%';
    $('bar').style.background = energy > (baseline ? baseline * 2.2 : 0.004) ? 'var(--ok)' : 'var(--warn)';
    $('infer').textContent = inferMs.toFixed(1) + ' ms';

    const n = presence.length;
    const rate = n ? presence.reduce((a, b) => a + b, 0) / n : 0;
    $('presence').textContent = (rate * 100).toFixed(0) + '%';

    fpsAcc += 1 / Math.max(0.001, (now - lastT) / 1000);
    fpsN++;
    lastT = now;
    if (fpsN >= 15) { $('fps').textContent = (fpsAcc / fpsN).toFixed(0) + ' fps'; fpsAcc = 0; fpsN = 0; }

    drawCurve();
    updateVerdict(rate);
  }
  requestAnimationFrame(loop);
}

function drawSkeleton(lm) {
  const W = cv.width, H = cv.height;
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = 'rgba(78,168,222,.95)';
  ctx.beginPath();
  for (const [a, b] of BONES) {
    ctx.moveTo(lm[a].x * W, lm[a].y * H);
    ctx.lineTo(lm[b].x * W, lm[b].y * H);
  }
  ctx.stroke();
  ctx.fillStyle = '#e8f4ff';
  for (let i = 0; i < lm.length; i++) {
    ctx.beginPath();
    ctx.arc(lm[i].x * W, lm[i].y * H, i % 4 === 0 ? 3.6 : 2.4, 0, 7);
    ctx.fill();
  }
}

function drawCurve() {
  const W = curve.width, H = curve.height;
  cctx.clearRect(0, 0, W, H);
  const max = 0.02;
  // 阈值线
  const thr = baseline ? baseline * 2.2 : 0.004;
  const ty = H - Math.min(1, thr / max) * H;
  cctx.strokeStyle = 'rgba(232,163,61,.6)';
  cctx.setLineDash([4, 4]);
  cctx.beginPath(); cctx.moveTo(0, ty); cctx.lineTo(W, ty); cctx.stroke();
  cctx.setLineDash([]);

  if (hist.length < 2) return;
  const t0 = performance.now() - 15000;
  cctx.strokeStyle = '#4ea8de';
  cctx.lineWidth = 1.8;
  cctx.beginPath();
  hist.forEach((p, i) => {
    const x = ((p.t - t0) / 15000) * W;
    const y = H - Math.min(1, p.e / max) * H;
    i ? cctx.lineTo(x, y) : cctx.moveTo(x, y);
  });
  cctx.stroke();
}

function updateVerdict(rate) {
  const v = $('verdict');
  if (rate < 0.3) {
    v.className = 'verdict bad';
    v.textContent = '手只有 ' + (rate * 100).toFixed(0) + '% 的时间在画面里。这个角度拍不到写字的手，停笔判定做不了，先把摄像头压低或者换个位置。';
    return;
  }
  if (!baseline) {
    v.className = 'verdict idle';
    v.textContent = '手在画面里的比例正常（' + (rate * 100).toFixed(0) + '%）。现在点「记 3 秒静息基线」，把手放桌上不动 3 秒。';
    return;
  }
  const hi = baseline * 2.2;
  v.className = energy > hi ? 'verdict ok' : 'verdict bad';
  v.textContent = energy > hi
    ? '当前能量 ' + energy.toFixed(4) + '，高于阈值 ' + hi.toFixed(4) + '，判定在写。'
    : '当前能量 ' + energy.toFixed(4) + '，低于阈值 ' + hi.toFixed(4) + '，判定停笔。';
}

/* 静息基线：3 秒静置的平均能量 */
$('btnBase').addEventListener('click', async () => {
  const btn = $('btnBase');
  btn.disabled = true;
  btn.textContent = '采样中 3…';
  baseBuf = [];
  const t0 = performance.now();
  const timer = setInterval(() => {
    baseBuf.push(energy);
    const left = Math.ceil((3000 - (performance.now() - t0)) / 1000);
    btn.textContent = '采样中 ' + Math.max(0, left) + '…';
  }, 100);
  setTimeout(() => {
    clearInterval(timer);
    const arr = baseBuf.slice().sort((a, b) => a - b);
    baseline = arr[Math.floor(arr.length * 0.5)] || 0.001;
    btn.disabled = false;
    btn.textContent = '基线 ' + baseline.toFixed(4) + '（重记）';
    updateVerdict(presence.length ? presence.reduce((a, b) => a + b, 0) / presence.length : 1);
  }, 3100);
});

$('btnStart').addEventListener('click', start);
</script>
</body>
</html>
