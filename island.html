<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EyePilot 灵动岛</title>
<style>
  :root {
    --bg: rgba(12, 15, 20, .92);
    --line: rgba(255, 255, 255, .10);
    --line-2: rgba(255, 255, 255, .18);
    --text: #e8eef7;
    --muted: #8b9aae;
    --dim: #64748b;
    --accent: #2ee6d6;
    --amber: #f5c451;
    --bad: #ff6b6b;
    --good: #3ddc97;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--text); -webkit-font-smoothing: antialiased;
    display: flex; justify-content: center; align-items: flex-start;
  }
  #island {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .5);
    overflow: hidden;
    transition: height .24s cubic-bezier(.22, 1, .36, 1), border-radius .24s;
    -webkit-app-region: drag;
  }
  body.expanded #island { border-radius: 12px; }

  /* ---------- 收起态：只有 状态 / 眨眼 / 模式 / 展开 ---------- */
  .bar { display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 8px 0 11px; }
  .dot {
    width: 6px; height: 6px; border-radius: 50%; flex: none;
    background: var(--good); box-shadow: 0 0 8px var(--good);
    transition: background .25s, box-shadow .25s;
  }
  .dot.warn { background: var(--amber); box-shadow: 0 0 8px var(--amber); }
  .dot.bad { background: var(--bad); box-shadow: 0 0 8px var(--bad); }
  .dot.idle { background: var(--dim); box-shadow: none; }

  .blink { display: flex; align-items: baseline; gap: 4px; flex: none; }
  .blink b { font-size: 15px; font-weight: 650; line-height: 1; font-variant-numeric: tabular-nums; }
  .blink span { font-size: 9px; color: var(--dim); }

  /* 视距：和眨眼并排；过近时这条会临时变成「距离太近」 */
  .dist { display: flex; align-items: baseline; gap: 3px; flex: none; }
  .dist b { font-size: 13px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
  .dist span { font-size: 9px; color: var(--dim); }
  .dist.warn b { color: var(--amber); }
  .dist.alert b { font-size: 11.5px; color: var(--amber); letter-spacing: .2px; }

  /* 专注胶囊出现时把「次/分」单位收起来，给模式按钮腾位置 */
  .bar:has(.focus-chip.show) .blink span { font-size: 9px; }
  .bar:has(.focus-chip.show) .blink b { font-size: 14px; }
  .modes { display: flex; gap: 2px; margin-left: auto; -webkit-app-region: no-drag; }
  .mode {
    width: 26px; height: 22px; border-radius: 6px; cursor: pointer;
    font-family: inherit; font-size: 10px; line-height: 1;
    color: var(--dim); background: transparent; border: 1px solid transparent;
    transition: all .18s;
  }
  .mode:hover { color: var(--text); background: rgba(255, 255, 255, .07); }
  /* 只显示当前操控方式；点它把整条切换成四选一，不展开面板也不加高窗口 */
  .mode-now {
    -webkit-app-region: no-drag; flex: none; margin-left: auto;
    display: inline-flex; align-items: center; gap: 3px; height: 24px; padding: 0 5px;
    border-radius: 7px; cursor: pointer; font-family: inherit; font-size: 10.5px;
    color: var(--accent); background: rgba(46, 230, 214, .10);
    border: 1px solid rgba(46, 230, 214, .26);
  }
  .mode-now:hover { background: rgba(46, 230, 214, .18); }
  .mode-now svg { width: 9px; height: 9px; }
  .mode-pick { display: none; align-items: center; gap: 3px; margin-left: auto; -webkit-app-region: no-drag; }
  .bar.picking .blink, .bar.picking .dist, .bar.picking .focus-chip,
  .bar.picking .alert-line, .bar.picking .mode-now, .bar.picking .chev { display: none; }
  .bar.picking .mode-pick { display: flex; margin-left: 0; flex: 1; justify-content: center; }
  .mode-pick .mode.on { color: #06110f; background: var(--accent); border-color: var(--accent); font-weight: 700; }
  .mode-pick .mode-x {
    width: 20px; height: 20px; border-radius: 6px; border: none; background: transparent;
    color: var(--dim); cursor: pointer; font-size: 13px; line-height: 1;
  }
  .mode-pick .mode-x:hover { color: var(--text); background: rgba(255, 255, 255, .08); }
  .focus-chip {
    display: none; align-items: center; padding: 2px 6px; border-radius: 5px;
    font-family: var(--mono); font-size: 10.5px; color: var(--accent);
    background: rgba(46, 230, 214, .1); border: 1px solid rgba(46, 230, 214, .28);
  }
  .focus-chip.show { display: inline-flex; }
  .focus-chip b { font-weight: 500; }
  /* 护眼提醒只在收起条里说一句，不替用户展开面板 */
  .alert-line {
    display: none; max-width: 128px; overflow: hidden; white-space: nowrap;
    text-overflow: ellipsis; font-size: 10.5px; color: var(--amber);
  }
  .bar.alerting .alert-line { display: block; }
  .alert-line { -webkit-app-region: no-drag; }
  .alert-line.clickable { cursor: pointer; text-decoration: underline dotted rgba(243, 196, 112, .65); text-underline-offset: 3px; }
  .bar.alerting .blink, .bar.alerting .focus-chip, .bar.alerting .dist { display: none; }
  .mode.on {
    color: #06110f; background: var(--accent); border-color: var(--accent); font-weight: 700;
  }

  .chev {
    -webkit-app-region: no-drag; flex: none;
    width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center;
    cursor: pointer; color: var(--muted); background: transparent; border: none;
    transition: transform .24s, color .18s;
  }
  .chev:hover { color: var(--text); background: rgba(255, 255, 255, .07); }
  body.expanded .chev { transform: rotate(180deg); }
  .chev svg { width: 12px; height: 12px; }

  /* ---------- 展开态 ---------- */
  .body { display: none; padding: 0 10px 10px; -webkit-app-region: no-drag; }
  body.expanded .body { display: block; }

  .alert {
    display: none; align-items: flex-start; gap: 7px; margin: 0 0 8px;
    padding: 7px 9px; border-radius: 8px; font-size: 10.5px; line-height: 1.5;
    border: 1px solid rgba(245, 196, 81, .32); background: rgba(245, 196, 81, .10); color: #ffdb9b;
  }
  .alert.show { display: flex; }
  .alert.bad { border-color: rgba(255, 107, 107, .38); background: rgba(255, 107, 107, .12); color: #ffb9b9; }
  .alert i { flex: none; width: 5px; height: 5px; border-radius: 50%; background: currentColor; margin-top: 5px; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  .cell {
    padding: 7px 9px; border-radius: 8px;
    background: rgba(255, 255, 255, .035); border: 1px solid var(--line);
  }
  .cell span { display: block; font-size: 9px; color: var(--dim); margin-bottom: 3px; }
  .cell b { font-size: 15px; font-weight: 620; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
  .cell.wide { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; }
  .cell.wide b { font-size: 12px; }

  .custom {
    display: none; align-items: center; gap: 8px; margin-top: 5px;
    padding: 7px 9px; border-radius: 8px;
    background: rgba(46, 230, 214, .06); border: 1px solid rgba(46, 230, 214, .16);
  }
  .custom.show { display: flex; }
  .custom i {
    flex: none; width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center;
    background: rgba(46, 230, 214, .14); color: var(--accent);
  }
  .custom i svg { width: 12px; height: 12px; }
  .custom div { min-width: 0; }
  .custom span { display: block; font-size: 8.5px; color: var(--dim); letter-spacing: .04em; }
  .custom b { display: block; font-size: 11px; font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .foot { display: flex; gap: 5px; margin-top: 8px; }
  .foot button {
    flex: 1; height: 28px; border-radius: 7px; cursor: pointer;
    font-size: 10.5px; font-family: inherit; color: var(--text);
    background: rgba(255, 255, 255, .06); border: 1px solid var(--line-2);
    transition: background .16s, border-color .16s;
  }
  .foot button:hover { background: rgba(255, 255, 255, .12); border-color: rgba(255, 255, 255, .28); }
  .foot button.primary { background: rgba(46, 230, 214, .14); border-color: rgba(46, 230, 214, .34); color: #b9fff8; }

  body.preview { align-items: center; background: #05070c; }
  body.preview #island { width: 300px; background: #0c1016; }
  /* 预览里也允许展开：这里就是给用户试着点的，不再把箭头藏起来 */
  body.preview .bar { cursor: default; }
  .cell[hidden], .blink[hidden], .custom[hidden] { display: none !important; }
</style>
</head>
<body>
  <div id="island">
    <div class="bar" id="bar">
      <i class="dot idle" id="dot"></i>
      <div class="blink"><b id="blink">--</b><span>次/分</span></div>
      <div class="focus-chip" id="focusChip" title="专注会话剩余时间"><b>--:--</b></div>
      <div class="dist" id="distChip" title="人脸到屏幕的估算距离"><b id="distVal">--</b><span>cm</span></div>
      <div class="alert-line" id="alertLine"></div>
      <button class="mode-now" id="modeNow" title="当前操控方式，点击切换">
        <b id="modeNowTx">眼</b>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="mode-pick" id="modePick">
        <button class="mode" data-mode="eye" title="纯眼控：虹膜决定光标，鼠标随时可接管">眼</button>
        <button class="mode" data-mode="hybrid" title="眼 + 鼠：眼睛和鼠标同时有效">混</button>
        <button class="mode" data-mode="head" title="眼 + 头：头定方向，虹膜精修">头</button>
        <button class="mode" data-mode="mouse" title="纯鼠标：眼控关闭，护眼与专注照常">鼠</button>
        <button class="mode-x" id="modePickClose" title="收起">×</button>
      </div>
      <button class="chev" id="chev" title="展开">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
    </div>

    <div class="body">
      <div class="alert" id="alert"><i></i><span id="alertText"></span></div>

      <div class="grid">
        <div class="cell" data-key="session"><span>用眼时长</span><b id="cSession">--</b></div>
        <div class="cell" data-key="fatigue"><span>疲劳指数</span><b id="cFatigue">--</b></div>
        <div class="cell" data-key="health"><span>健康分</span><b id="cHealth">--</b></div>
        <div class="cell"><span>专注度</span><b id="cFocus">--</b></div>
        <div class="cell wide"><span>专注会话</span><b id="cFocusSession">未开始</b></div>
        <div class="cell wide" data-key="nextBreak"><span>下次远眺</span><b id="cBreak">--</b></div>
      </div>

      <div class="custom" id="custom">
        <i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg></i>
        <div><span id="customLabel">正在播放</span><b id="customText">--</b></div>
      </div>

      <div class="foot">
        <button class="primary" data-act="show">主界面</button>
        <button data-act="eyecare">护眼</button>
        <button data-act="refine">对齐</button>
      </div>
    </div>
  </div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const host = window.islandHost || null;
  const preview = new URLSearchParams(location.search).has('preview') || !host;

  const COLLAPSED = 42;
  let expanded = false;
  let manual = false;
  let lastAlertTs = 0;
  let peekTimer = 0;
  let mode = 'eye';
  let lastTooClose = false;
  let closeAlertUntil = 0;
  const MODE_TX = { eye: '眼', hybrid: '混', head: '头', mouse: '鼠' };

  // 设置页会把「勾了哪些指标 / 自定义内容」推过来，预览要和真机一致
  const cfg = {
    enabled: true,
    items: { blink: true, session: true, fatigue: true, health: true, nextBreak: true },
    customLabel: '正在播放',
    customText: '',
  };

  const pad = (n) => String(n).padStart(2, '0');
  const clock = (s) => `${pad(Math.floor(s / 3600))}:${pad(Math.floor((s % 3600) / 60))}`;
  // 专注会话是 25 分钟一轮，用 mm:ss 比 h:mm 直观
  const mmss = (s) => `${pad(Math.floor(s / 60))}:${pad(Math.floor(s % 60))}`;

  if (preview) {
    document.body.classList.add('preview');
    document.documentElement.style.background = '#05070c';
    document.body.style.background = '#05070c';
  }

  function postHeight(h) {
    if (!preview || window.parent === window) return;
    try { window.parent.postMessage({ type: 'eyepilot:island-height', height: h }, '*'); } catch { /* noop */ }
  }

  let lastH = -1;
  function fitHeight() {
    const h = expanded
      ? Math.max(COLLAPSED + 24, Math.ceil($('island').scrollHeight) + 2)
      : COLLAPSED;
    if (h === lastH) return;
    lastH = h;
    if (host && host.resize) host.resize(300, Math.min(460, h));
    postHeight(h);
  }

  function setExpanded(on) {
    expanded = on;
    document.body.classList.toggle('expanded', on);
    fitHeight();
    setTimeout(fitHeight, 280);
  }

  $('chev').addEventListener('click', (e) => {
    e.stopPropagation();
    manual = true;
    setExpanded(!expanded);
  });

  const barEl = document.querySelector('.bar');
  const modeNow = $('modeNow');
  const modePick = $('modePick');
  const setPicking = (on) => {
    barEl.classList.toggle('picking', on);
    modePick.hidden = !on;
  };
  modeNow.addEventListener('click', (e) => {
    e.stopPropagation();
    setPicking(!barEl.classList.contains('picking'));
  });
  $('modePickClose').addEventListener('click', (e) => {
    e.stopPropagation();
    setPicking(false);
  });

  document.querySelectorAll('.mode').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      mode = btn.dataset.mode;
      paintMode();
      setPicking(false);
      // 预览只改自己，不去动真实输入方式，避免「只是看看」却把眼控切走
      if (!preview && host && host.action) host.action('mode:' + mode);
    });
  });

  document.querySelectorAll('[data-act]').forEach((btn) => {
    btn.addEventListener('click', () => {
      if (preview) return;
      if (host && host.action) host.action(btn.dataset.act);
    });
  });

  function paintMode() {
    document.querySelectorAll('.mode').forEach((b) => b.classList.toggle('on', b.dataset.mode === mode));
    const tx = $('modeNowTx');
    if (tx) tx.textContent = MODE_TX[mode] || '眼';
  }

  // 距离过近：先亮 2.5 秒「距离太近」，再回到真实距离（仍然偏近时用琥珀色）
  function paintDistance(dist) {
    const chip = $('distChip');
    const unit = chip.querySelector('span');
    const too = dist > 0 && dist < 42;
    const now = Date.now();
    if (too && !lastTooClose) closeAlertUntil = now + 2500;
    lastTooClose = too;
    const alerting = too && now < closeAlertUntil;
    chip.style.display = dist > 0 ? '' : 'none';
    chip.classList.toggle('alert', alerting);
    chip.classList.toggle('warn', too && !alerting);
    if (alerting) {
      $('distVal').textContent = '距离太近';
      unit.style.display = 'none';
    } else {
      $('distVal').textContent = dist > 0 ? String(dist) : '--';
      unit.style.display = '';
    }
  }

  function applyVisibility() {
    document.querySelectorAll('[data-key]').forEach((n) => {
      n.hidden = cfg.items[n.dataset.key] === false;
    });
    const blink = document.querySelector('.blink');
    if (blink) blink.hidden = cfg.items.blink === false;
  }

  function levelOf(p) {
    if (!p.live) return 'idle';
    if (p.alert && p.alert.level === 'bad') return 'bad';
    if (p.fatigue >= 65 || (p.blink && p.blink < 8)) return 'warn';
    if (p.alert && p.alert.level === 'warn') return 'warn';
    return 'on';
  }

  let barAlertTimer = 0;
  let barAlertUntil = 0;
  let barHint = null;

  function showBarAlert(text) {
    const bar = document.querySelector('.bar');
    const line = $('alertLine');
    if (!bar || !line) return;
    line.textContent = text || '该休息了';
    line.classList.remove('clickable');
    bar.classList.add('alerting');
    barAlertUntil = Date.now() + 8000;
    clearTimeout(barAlertTimer);
    barAlertTimer = setTimeout(() => {
      barAlertUntil = 0;
      if (barHint) {
        line.textContent = barHint.text;
        line.classList.toggle('clickable', !!barHint.action);
      } else {
        bar.classList.remove('alerting');
      }
    }, 8000);
  }

  // 持续提示（健康异常 / 远眺）：不自动消失，指标恢复才收起
  function showBarHint(hint) {
    const bar = document.querySelector('.bar');
    const line = $('alertLine');
    if (!bar || !line) return;
    barHint = hint;
    if (Date.now() < barAlertUntil) return;
    line.textContent = hint.text;
    line.classList.toggle('clickable', !!hint.action);
    bar.classList.add('alerting');
  }

  function clearBarHint() {
    if (!barHint) return;
    barHint = null;
    if (Date.now() < barAlertUntil) return;
    const bar = document.querySelector('.bar');
    const line = $('alertLine');
    if (bar) bar.classList.remove('alerting');
    if (line) line.classList.remove('clickable');
  }

  $('alertLine').addEventListener('click', (e) => {
    e.stopPropagation();
    if (!barHint || !barHint.action) return;
    if (!preview && host && host.action) host.action(barHint.action);
  });

  function render(p) {
    // 桌面版的推送里也带 items：勾掉「疲劳指数」就真的不显示，
    // 之前这三个勾选框只是摆设。
    if (p.items) cfg.items = { ...cfg.items, ...p.items };
    applyVisibility();
    const lv = levelOf(p);
    $('dot').className = 'dot ' + (lv === 'on' ? '' : lv);
    $('blink').textContent = p.blink > 0 ? p.blink : '--';
    paintDistance(Math.round(Number(p.distance) || 0));

    $('cSession').textContent = clock(p.session || 0);
    $('cFatigue').textContent = p.fatigue || '--';
    $('cHealth').textContent = p.health || '--';
    $('cFocus').textContent = p.focus || '--';
    const fs = p.focusSession;
    $('focusChip').classList.toggle('show', !!(fs && fs.running));
    // 挤的时候「次/分」缩成一个「眨」字，避免和专注时间混读
    const bu = document.querySelector('.blink span');
    if (bu) bu.textContent = (fs && fs.running) ? '眨' : '次/分';
    if (fs && fs.running) $('focusChip').querySelector('b').textContent = mmss(fs.remain);
    $('cFocusSession').textContent = !fs
      ? '--'
      : (!fs.running && !fs.finished && fs.remain >= fs.total)
        ? '未开始'
        : `${mmss(fs.remain)} · ${fs.score} 分 · ${fs.label}${fs.finished ? '（已完成）' : ''}`;
    $('cBreak').textContent = !p.live
      ? '未启动'
      : (p.nextBreak == null ? '--'
        : (p.nextBreak <= 0 ? '该休息了' : `${Math.floor(p.nextBreak / 60)} 分 ${pad(p.nextBreak % 60)} 秒后`));

    const showCustom = !!p.customText;
    $('custom').classList.toggle('show', showCustom);
    if (showCustom) {
      $('customLabel').textContent = p.customLabel || '自定义';
      $('customText').textContent = p.customText;
    }

    if (p.alert && p.alert.ts && p.alert.ts > lastAlertTs) {
      lastAlertTs = p.alert.ts;
      const box = $('alert');
      box.className = 'alert show' + (p.alert.level === 'bad' ? ' bad' : '');
      $('alertText').textContent = `${p.alert.title}：${p.alert.detail || ''}`.slice(0, 80);
      // 提醒只在收起条里亮一行，绝不替用户把面板拉开——之前就是这一步挡住屏幕
      showBarAlert(p.alert.title);
    }

    // 持续提示：远眺 / 健康异常。告警的 8 秒优先，过了再显示它
    if (p.hint && p.hint.text) showBarHint(p.hint);
    else clearBarHint();

    // 护眼弹层打开时强制收起，避免「弹层 + 岛」一起挡屏
    if (p.breakOpen && expanded) {
      manual = false;
      setExpanded(false);
    }
    fitHeight();
  }

  async function tick() {
    if (preview) {
      // 预览：用示例数字演示展开后的样子，指标按设置里的勾选显示
      render({
        live: true,
        blink: cfg.items.blink === false ? 0 : 17,
        distance: 58,
        hint: null,
        session: 4280,
        fatigue: cfg.items.fatigue === false ? 0 : 28,
        health: cfg.items.health === false ? 0 : 82,
        focus: 76,
        nextBreak: cfg.items.nextBreak === false ? null : 640,
        focusSession: { running: true, finished: false, remain: 1240, total: 1500, score: 82, label: '专注' },
        customLabel: cfg.customLabel || '正在播放',
        customText: cfg.customText,
        alert: null,
      });
      return;
    }
    try {
      const res = await fetch('/api/island/metrics', { cache: 'no-store' });
      if (!res.ok) throw new Error('no api');
      const p = await res.json();
      if (p && p.ts) {
        if (p.mode && p.mode !== mode) { mode = p.mode; paintMode(); }
        render(p);
      }
    } catch {
      render({ live: false, blink: 0, session: 0, fatigue: 0, health: 0, focus: 0, nextBreak: null });
    }
  }

  window.addEventListener('message', (ev) => {
    const d = ev.data;
    if (!d || d.type !== 'eyepilot:island-config') return;
    cfg.enabled = d.enabled !== false;
    cfg.items = { ...cfg.items, ...(d.items || {}) };
    cfg.customLabel = d.customLabel || '';
    cfg.customText = d.customText || '';
    if (d.mode) { mode = d.mode; paintMode(); }
    applyVisibility();
    if (preview) tick();
    fitHeight();
  });

  if (host && host.resize) host.resize(300, COLLAPSED);
  applyVisibility();
  paintMode();
  tick();
  setInterval(tick, 800);
})();
</script>
</body>
</html>
