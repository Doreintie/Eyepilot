<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#05070c" />
<title>EyePilot 手机摄像头</title>
<link rel="icon" href="data:," />
<style>
  :root {
    --bg: #05070c;
    --panel: #0b1119;
    --line: rgba(255, 255, 255, .09);
    --text: #e8effb;
    --muted: #8fa4bd;
    --accent: #2ee6d6;
    --warn: #f0b24b;
    --bad: #ff6b6b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; min-height: 100dvh;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  header {
    padding: 16px 18px 10px; display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid var(--line);
  }
  .mark {
    width: 28px; height: 28px; border-radius: 8px; flex: none;
    border: 1px solid rgba(46, 230, 214, .45); display: grid; place-items: center;
    color: var(--accent); font-size: 13px; font-weight: 500;
  }
  header h1 { font-size: 15px; font-weight: 500; margin: 0; letter-spacing: -.01em; }
  header p { margin: 2px 0 0; font-size: 11.5px; color: var(--muted); }
  .stage { position: relative; flex: 1; min-height: 0; background: #000; overflow: hidden; }
  video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; transform: scaleX(-1);
  }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; transform: scaleX(-1); }
  .hint {
    position: absolute; left: 12px; right: 12px; bottom: 12px;
    padding: 9px 12px; border-radius: 10px; font-size: 12px; line-height: 1.5;
    background: rgba(5, 7, 12, .72); border: 1px solid var(--line);
    backdrop-filter: blur(8px); color: var(--muted); text-align: center;
  }
  .hint b { color: var(--text); font-weight: 500; }
  .panel { padding: 14px 18px 18px; border-top: 1px solid var(--line); background: var(--panel); }
  .stats { display: flex; gap: 8px; margin-bottom: 12px; }
  .stat {
    flex: 1; padding: 9px 10px; border-radius: 10px; background: rgba(255, 255, 255, .03);
    border: 1px solid var(--line);
  }
  .stat span { display: block; font-size: 10px; color: var(--muted); letter-spacing: .06em; }
  .stat b { display: block; font-size: 16px; font-weight: 500; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .stat b.on { color: var(--accent); }
  .stat b.warn { color: var(--warn); }
  .stat b.bad { color: var(--bad); }
  button {
    width: 100%; height: 50px; border-radius: 12px; border: 1px solid transparent;
    font-size: 15px; font-weight: 500; font-family: inherit; cursor: pointer;
    background: var(--accent); color: #04110f;
  }
  button.ghost { background: transparent; color: var(--text); border-color: var(--line); height: 44px; font-size: 13px; }
  button:disabled { opacity: .55; }
  .err {
    margin-top: 10px; padding: 10px 12px; border-radius: 10px; font-size: 12px; line-height: 1.6;
    background: rgba(255, 107, 107, .1); border: 1px solid rgba(255, 107, 107, .3); color: #ffc9c9;
    display: none;
  }
  .err.show { display: block; }
  .foot { margin-top: 10px; font-size: 11px; color: var(--muted); line-height: 1.6; text-align: center; }
</style>
</head>
<body>
<header>
  <div class="mark">瞳</div>
  <div>
    <h1>EyePilot 手机摄像头</h1>
    <p id="who">等待连接</p>
  </div>
</header>

<div class="stage">
  <video id="cam" playsinline muted autoplay></video>
  <canvas id="ov"></canvas>
  <div class="hint" id="hint">把手机架在屏幕侧上方 30–45°，正对你的脸，让两只眼睛完整入镜</div>
</div>

<div class="panel">
  <div class="stats">
    <div class="stat"><span>状态</span><b id="sState" class="warn">未启动</b></div>
    <div class="stat"><span>帧率</span><b id="sFps">--</b></div>
    <div class="stat"><span>已发送</span><b id="sSent">0</b></div>
  </div>
  <button id="btnStart">开始推流</button>
  <button id="btnStop" class="ghost" style="margin-top:8px; display:none">停止</button>
  <div class="err" id="err"></div>
  <p class="foot">画面只在本机解析，<b>视频不出手机</b>；只把 478 个关键点（约 3 KB/帧）发给电脑。</p>
</div>

<script type="module">
import { encodeFrame } from './src/net/protocol.js';
import { FilesetResolver, FaceLandmarker } from './vendor/mediapipe/vision_bundle.mjs';

const $ = (id) => document.getElementById(id);
const video = $('cam');
const ov = $('ov');
const octx = ov.getContext('2d');
const params = new URLSearchParams(location.search);
const token = params.get('t') || '';
const deviceName = (params.get('name') || '').trim() || '手机摄像头';

const SEND_FPS = 24;          // 手机端主动限频，省电也省带宽
const EYE_IDS = [468, 473, 33, 133, 362, 263];

let landmarker = null;
let running = false;
let raf = 0;
let seq = 0;
let sent = 0;
let inFlight = false;
let lastSend = 0;
let lastVideoTime = -1;
let fps = 0;
let fpsAt = 0;
let fpsCount = 0;
let lastErr = '';

function setState(text, cls) {
  const el = $('sState');
  el.textContent = text;
  el.className = cls || '';
}

function fail(msg) {
  const el = $('err');
  el.textContent = msg;
  el.classList.add('show');
  lastErr = msg;
}

function clearErr() {
  $('err').classList.remove('show');
  $('err').textContent = '';
  lastErr = '';
}

function authHeaders() {
  return token ? { 'X-EyePilot-Token': token } : {};
}

async function loadModel() {
  if (landmarker) return landmarker;
  setState('加载模型', 'warn');
  const fileset = await FilesetResolver.forVisionTasks('./vendor/mediapipe/wasm');
  const opts = {
    baseOptions: { modelAssetPath: './vendor/mediapipe/face_landmarker.task', delegate: 'GPU' },
    runningMode: 'VIDEO',
    numFaces: 1,
    outputFaceBlendshapes: true,
    minFaceDetectionConfidence: 0.4,
    minFacePresenceConfidence: 0.4,
    minTrackingConfidence: 0.5,
  };
  try {
    landmarker = await FaceLandmarker.createFromOptions(fileset, opts);
  } catch (e) {
    landmarker = await FaceLandmarker.createFromOptions(fileset, {
      ...opts, baseOptions: { ...opts.baseOptions, delegate: 'CPU' },
    });
  }
  return landmarker;
}

async function start() {
  clearErr();
  $('btnStart').disabled = true;
  try {
    if (!window.isSecureContext) {
      throw new Error('当前不是安全上下文。请用 https:// 地址打开（电脑上运行 python serve.py --lan 会打印地址）。');
    }
    await loadModel();
    setState('启动相机', 'warn');
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30, max: 30 } },
    });
    video.srcObject = stream;
    await video.play();
    resizeOverlay();

    await fetch('/api/link/hello', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...authHeaders() },
      body: JSON.stringify({ name: deviceName, width: video.videoWidth, height: video.videoHeight }),
    }).catch(() => {});

    running = true;
    $('who').textContent = `${deviceName} · ${video.videoWidth}×${video.videoHeight}`;
    setState('推流中', 'on');
    $('btnStart').style.display = 'none';
    $('btnStop').style.display = 'block';
    tick();
  } catch (e) {
    const name = e && e.name;
    if (name === 'NotAllowedError') fail('相机权限被拒绝。请在浏览器地址栏左侧的锁图标里允许摄像头，然后刷新。');
    else if (name === 'NotFoundError') fail('没有找到摄像头。');
    else if (name === 'NotReadableError') fail('摄像头被其他 App 占用，先关掉相机 / 视频通话。');
    else fail((e && e.message) || '启动失败');
    setState('启动失败', 'bad');
    $('btnStart').disabled = false;
  }
}

function stop() {
  running = false;
  cancelAnimationFrame(raf);
  if (video.srcObject) {
    video.srcObject.getTracks().forEach((t) => t.stop());
    video.srcObject = null;
  }
  fetch('/api/link/bye', { method: 'POST', headers: authHeaders() }).catch(() => {});
  $('btnStart').style.display = 'block';
  $('btnStop').style.display = 'none';
  $('btnStart').disabled = false;
  setState('已停止', 'warn');
  $('who').textContent = '等待连接';
}

function resizeOverlay() {
  const w = video.videoWidth || 720;
  const h = video.videoHeight || 1280;
  if (ov.width !== w || ov.height !== h) { ov.width = w; ov.height = h; }
}

function drawOverlay(lm, w, h) {
  octx.clearRect(0, 0, ov.width, ov.height);
  if (!lm) return;
  const s = Math.max(ov.width, ov.height) / 720;
  octx.strokeStyle = 'rgba(46, 230, 214, .85)';
  octx.lineWidth = 1.6 * s;
  for (const id of EYE_IDS) {
    const p = lm[id];
    if (!p) continue;
    octx.beginPath();
    octx.arc(p.x * ov.width, p.y * ov.height, 3.2 * s, 0, Math.PI * 2);
    octx.stroke();
  }
}

function faceRatio(lm) {
  if (!lm) return 0;
  let minX = 1, maxX = 0;
  for (const id of [234, 454]) {
    if (lm[id].x < minX) minX = lm[id].x;
    if (lm[id].x > maxX) maxX = lm[id].x;
  }
  return maxX - minX;
}

async function post(buf) {
  if (inFlight) return;
  inFlight = true;
  try {
    const r = await fetch('/api/link/frame', {
      method: 'POST',
      headers: { 'Content-Type': 'application/octet-stream', ...authHeaders() },
      body: buf,
      cache: 'no-store',
    });
    if (r.status === 401) {
      fail('令牌不对。请用电脑上打印的完整地址重新打开（地址里带 ?t=...）。');
      setState('令牌错误', 'bad');
      running = false;
    } else if (r.ok) {
      sent++;
      $('sSent').textContent = String(sent);
      clearErr();
    }
  } catch {
    // 网络抖动不打断推流，下一帧继续
  } finally {
    inFlight = false;
  }
}

function tick() {
  if (!running) return;
  raf = requestAnimationFrame(tick);
  const v = video;
  if (!v || v.readyState < 2) return;
  if (v.currentTime === lastVideoTime) return;
  lastVideoTime = v.currentTime;

  let result = null;
  try {
    result = landmarker.detectForVideo(v, performance.now());
  } catch {
    return;
  }
  const lm = result && result.faceLandmarks && result.faceLandmarks[0];
  drawOverlay(lm, v.videoWidth, v.videoHeight);

  const now = performance.now();
  if (!fpsAt) fpsAt = now;
  fpsCount++;
  if (now - fpsAt >= 1000) {
    fps = Math.round((fpsCount * 1000) / (now - fpsAt));
    fpsCount = 0;
    fpsAt = now;
    $('sFps').textContent = String(fps);
    $('sFps').className = fps >= 15 ? 'on' : 'warn';
  }

  if (!lm) {
    $('hint').innerHTML = '没检测到人脸 —— 把手机转向自己，让<b>整张脸</b>在画面里';
    return;
  }
  const ratio = faceRatio(lm);
  if (ratio < 0.16) $('hint').innerHTML = '脸有点小 —— 手机<b>靠近一些</b>（或把人脸占比调到 1/3 左右）';
  else if (ratio > 0.62) $('hint').innerHTML = '太近了 —— 稍微<b>拿远一点</b>，否则眼角会出画';
  else $('hint').innerHTML = `<b>识别正常</b> · 人脸占画面 ${Math.round(ratio * 100)}% · 保持不动`;

  if (now - lastSend < 1000 / SEND_FPS) return;
  lastSend = now;

  let blinkL = 0, blinkR = 0;
  const cats = result.faceBlendshapes && result.faceBlendshapes[0] ? result.faceBlendshapes[0].categories : null;
  if (cats) {
    for (const c of cats) {
      if (c.categoryName === 'eyeBlinkLeft') blinkL = c.score;
      else if (c.categoryName === 'eyeBlinkRight') blinkR = c.score;
    }
  }
  const buf = encodeFrame({
    seq: seq++,
    captureAt: now,
    width: v.videoWidth,
    height: v.videoHeight,
    landmarks: lm,
    blinkL,
    blinkR,
  });
  post(buf);
}

// 就绪标记：方便排查「页面出来了但脚本没跑」
document.documentElement.dataset.phone = 'ready';
$('btnStart').addEventListener('click', start);
$('btnStop').addEventListener('click', stop);
document.addEventListener('visibilitychange', () => {
  if (document.hidden && running) {
    setState('后台暂停', 'warn');
    $('hint').innerHTML = '页面切到后台了 —— 手机浏览器会暂停摄像头，请<b>保持本页在前台</b>';
  } else if (!document.hidden && running) {
    setState('推流中', 'on');
  }
});
</script>
</body>
</html>
